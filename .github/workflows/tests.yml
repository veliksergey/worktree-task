# Runs the shell suite on the three platforms AGENTS.md names: Linux, macOS with the
# system bash 3.2, and Windows with Git Bash. The suite needs only bash and git, and it
# sets its own git identity, so the job needs no secrets.
name: tests

on:
  push:
  pull_request:

jobs:
  shell-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # The system bash on macOS is 3.2, the oldest bash the script must support.
          # The runner's PATH puts a newer Homebrew bash first, so /bin goes first.
          - os: macos-latest
            bash_dir: /bin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run tests/worktree.test.sh
        shell: bash
        env:
          BASH_DIR: ${{ matrix.bash_dir }}
        run: |
          # Every "bash" in the job must resolve to the pinned one: the harness, the
          # script under test, which the harness starts with a bare "bash", and the
          # harness's own nested run.
          if [ -n "$BASH_DIR" ]; then PATH="$BASH_DIR:$PATH"; export PATH; fi
          command -v bash
          bash --version | head -n 1
          # A suite that stalls is stopped after 20 minutes, so the step ends and its
          # log is kept. A job that reaches timeout-minutes is cancelled without one.
          # Job control gives each background job its own process group to kill.
          set -m
          bash tests/worktree.test.sh &
          suite=$!
          (
            sleep 1200
            echo "watchdog: the suite is still running after 20 minutes; stopping it"
            kill -TERM -- -"$suite" 2>/dev/null; sleep 5; kill -KILL -- -"$suite" 2>/dev/null
          ) &
          watchdog=$!
          set +m
          wait "$suite"; rc=$?
          kill -- -"$watchdog" 2>/dev/null || true
          exit "$rc"
